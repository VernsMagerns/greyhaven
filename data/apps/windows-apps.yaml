# Windows apps GreyHaven recognises, and how each does on Linux. Licensed CC-BY-4.0 (see ../LICENSE).
# Games with anti-cheat come from anticheat.json and other Steam games from protondb-summary.json.gz;
# an entry here wins over both.
#
#   match.names:      the app's name in Windows' installed-apps list, compared after tidying
#                     (lower case, no ® or ™, no "(x64)" or version numbers at the end)
#   match.startsWith: the tidied name starts with one of these
#   match.store:      Microsoft Store package names (the part before the first "_")
#   match.steam:      Steam app IDs
#   rating:           native     - has a Linux version (linux: the Linux app)
#                     layer      - the Windows version runs with a compatibility layer (layer: proton | wine | lutris | heroic)
#                     web        - use the website (web: its address)
#                     wontWork   - no Linux version and it won't run (reason: noLinuxVersion | antiCheat)
#                     notNeeded  - Linux does this job itself
#   alternatives:     { app: linux-apps.yaml id | web: { name, url }, closeness: same | close | partial, note }
#   uses:             hardware it depends on (component categories), e.g. webcam for capture cards
#   source:           where the claim was checked (2026-10-07). "blocks automated checks": loads in a
#                     browser but refuses scripts; confirmed through search results.

apps:
  # ---- Browsers --------------------------------------------------------------------------------
  - { id: chrome, name: Google Chrome, category: browsers, match: { names: [google chrome] }, rating: native, linux: chrome,
      source: { title: "Google - Chrome for Linux", url: "https://www.google.com/chrome/?platform=linux" } }
  - { id: firefox, name: Firefox, category: browsers, match: { startsWith: [mozilla firefox] }, rating: native, linux: firefox,
      source: { title: "Mozilla - Firefox for Linux", url: "https://www.mozilla.org/firefox/linux/" } }
