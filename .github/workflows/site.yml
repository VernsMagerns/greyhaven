name: Website

# Builds the landing page (site/, assembled by tools/site/build.sh), tests its interactive parts
# in a simulated browser, and deploys it to Cloudflare Pages, project "greyhaven"
# (https://greyhaven.pages.dev). Uses the same Cloudflare secrets as the phone guide
# (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID). Every push to main that touches the site goes live.

on:
  push:
    branches: [main]
    paths: ["site/**", "assets/brand/**", "data/apps/**", "tools/site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: true

env:
  PROJECT: greyhaven

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the site
        run: ./tools/site/build.sh _site

      - name: Test the interactive parts
        run: |
          npm install --silent --prefix /tmp/sitetest jsdom@26
          NODE_PATH=/tmp/sitetest/node_modules node tools/site/test.cjs _site

      - name: Check for Cloudflare settings
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Cloudflare secrets aren't set, so the site was built and tested but not deployed."; fi

      # First run only: creates the Pages project. Later runs say it already exists, which is fine.
      - name: Create the Pages project
        if: steps.cf.outputs.ready == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.PROJECT }} --production-branch=main

      - name: Deploy
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=${{ env.PROJECT }} --branch=main --commit-dirty=true

      - name: Check the live site
        if: steps.cf.outputs.ready == 'true'
        run: |
          sleep 20
          for path in / /data/games.json /og-image.png; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://${PROJECT}.pages.dev$path")
            echo "https://${PROJECT}.pages.dev$path -> $code"
            [ "$code" = "200" ] || echo "::warning::Not live at https://${PROJECT}.pages.dev$path yet (or Cloudflare gave the project another address)."
          done
