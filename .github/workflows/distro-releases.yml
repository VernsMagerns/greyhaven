name: Check for new distro releases

# Weekly check for releases of Linux Mint, Ubuntu and Pop!_OS newer than the bundled data
# (e.g. Linux Mint 23). Opens one issue per new release so the data gets updated.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Check release feeds
        id: check
        run: |
          dotnet run --project src/GreyHaven.Cli -c Release -- check-releases --json > releases.json || true
          cat releases.json
      - name: Open an issue for each new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -c '.newer[]' releases.json | while read -r r; do
            name=$(jq -r '.distroName' <<< "$r")
            found=$(jq -r '.found' <<< "$r")
            current=$(jq -r '.current' <<< "$r")
            url=$(jq -r '.url // ""' <<< "$r")
            title="Update data for new release: $name $found"
            if gh issue list --state open --search "in:title \"$title\"" --json title --jq '.[].title' | grep -Fxq "$title"; then
              echo "Issue already open: $title"
              continue
            fi
            body=$(printf '%s\n' \
              "The weekly release check found **$name $found**; GreyHaven's data covers **$current**." \
              "" \
              "$url" \
              "" \
              "To update (see tools/GreyHaven.IndexBuilder/README.md):" \
              "- [ ] Find the kernel on the new official ISO (ISO package manifest) and update \`data/distros.yaml\` (version, kernels, \`verifiedFrom\`, ISO build numbers)." \
              "- [ ] Run \`dotnet run --project tools/GreyHaven.IndexBuilder -- all\`." \
              "- [ ] Review rule conditions and \`RealDataTests\` for changed ratings, then \`dotnet test\`." \
              "- [ ] Publish a GreyHaven release so users get the new data.")
            gh issue create --title "$title" --body "$body"
          done
          errors=$(jq -r '.errors[]?' releases.json)
          if [ -n "$errors" ]; then
            echo "::warning::Some release feeds couldn't be checked: $errors"
          fi
