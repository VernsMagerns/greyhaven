name: CI

on:
  push:              # every branch, so every push has a downloadable Windows build
  pull_request:
  workflow_dispatch: # "Run workflow" button on the Actions tab

# The jobs that run ON Windows (live scan, helper handshake, UI smoke test, installer) run for
# pull requests, pushes to main and manual runs (free for public repositories). Pushes to other
# branches get the Linux tests and the greyhaven-windows build; their pull request runs the rest.

permissions:
  contents: read

# A newer push to the same branch cancels the older run (saves Actions minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build --logger "console;verbosity=normal"

  # Builds the Windows app and CLI (self-contained: nothing to install on the PC) and uploads
  # them as the "greyhaven-windows" artifact: open the workflow run on GitHub, scroll to
  # Artifacts and download. Cross-built on Linux, which is faster and uses fewer minutes.
  # The release check fails the job if a placeholder (e.g. the GitHub repo name) would ship.
  windows-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build Windows app and CLI
        run: ./tools/publish-windows.sh
      - name: Release check (no placeholders)
        run: ./tools/release-check.sh artifacts/windows
      - uses: actions/upload-artifact@v4
        with:
          name: greyhaven-windows
          path: artifacts/windows
          # Each build is ~100 MB zipped, and artifacts count against the 500 MB of Actions storage on
          # GitHub Free. Kept 2 days: just long enough for the release job below to pick it up.
          # The lasting download is the "latest-test" pre-release.
          retention-days: 2
          if-no-files-found: error

  # Runs the real WMI/registry scanner on a Windows VM. A VM is not real hardware, and
  # GitHub's runners run as administrator, so this does NOT prove non-admin behaviour or
  # real-device accuracy. It does prove the scanner runs end to end on Windows, and the
  # output is downloadable from the workflow run for inspection.
  windows-live-scan:
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Live scan and replay
        shell: pwsh
        run: |
          dotnet build src/GreyHaven.Cli -c Release
          $exe = "src/GreyHaven.Cli/bin/Release/net10.0/greyhaven.exe"
          & $exe scan --dump-raw ci-raw.json --out ci-profile.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The replayed raw dump must produce the same profile as the live scan.
          & $exe scan --raw ci-raw.json --json | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Rate the VM's hardware with the bundled data (offline, so CI never hits linux-hardware.org).
          & $exe rate --raw ci-raw.json --offline --out ci-report.json --out ci-report.html
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Helper handshake (permission prompt, pipe, token)
        shell: pwsh
        run: |
          dotnet build src/GreyHaven.Helper -c Release
          $helper = (Resolve-Path "src/GreyHaven.Helper/bin/Release/net10.0/GreyHaven.Helper.exe").Path
          & "src/GreyHaven.Cli/bin/Release/net10.0/greyhaven.exe" helper-check $helper
          if ($LASTEXITCODE -ne 0) { throw "The helper handshake failed." }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-vm-scan
          retention-days: 14
          path: |
            ci-raw.json
            ci-profile.json
            ci-report.json
            ci-report.html

  # Launches the WPF app in demo mode on a Windows VM, walks the main flow, saves screenshots
  # (light and dark) and fails if any control lacks an accessible name. Screenshots are
  # downloadable from the workflow run, so the UI can be reviewed without a Windows PC.
  # Two images: Windows Server 2025 (Windows 11 24H2 generation) and Windows Server 2022, which
  # lacks Windows 11's "Segoe Fluent Icons" font, so the icon-font fallback Windows 10 relies on
  # gets exercised too. GitHub has no Windows 10 or 11 client images; see docs/windows-versions.md.
  ui-smoke:
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        image: [windows-2025, windows-2022]
    runs-on: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Which icon fonts does this image have?
        shell: pwsh
        run: |
          "Windows 11 icon font (Segoe Fluent Icons, SegoeIcons.ttf): $(Test-Path "$env:WINDIR\Fonts\SegoeIcons.ttf")"
          "Windows 10 icon font (Segoe MDL2 Assets, segmdl2.ttf): $(Test-Path "$env:WINDIR\Fonts\segmdl2.ttf")"
      - name: Bigger screen for whole-window screenshots
        shell: pwsh
        continue-on-error: true
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Get-CimInstance Win32_VideoController | Select-Object CurrentHorizontalResolution, CurrentVerticalResolution
      - name: Build app
        run: dotnet build src/GreyHaven.App -c Release
      - name: Run UI smoke test
        run: dotnet run --project tools/GreyHaven.UiSmoke -c Release -- src/GreyHaven.App/bin/Release/net10.0-windows/GreyHaven.exe ui-screenshots nvidia-desktop
      - name: README screenshots (no demo badge, bigger window)
        if: matrix.image == 'windows-2025'
        run: dotnet run --project tools/GreyHaven.UiSmoke -c Release --no-build -- src/GreyHaven.App/bin/Release/net10.0-windows/GreyHaven.exe readme-screenshots nvidia-desktop --screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots-${{ matrix.image }}
          retention-days: 14
          path: |
            ui-screenshots
            readme-screenshots

  # GreyHaven.msi and GreyHaven-Setup.exe (WiX, Windows only), built from the same app as the zip,
  # then really installed, checked and uninstalled on the runner, both ways.
  installer:
    needs: windows-build
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: greyhaven-windows
          path: artifacts/windows
      - name: Build the MSI and Setup.exe
        run: dotnet build installer/bundle/GreyHaven.Bundle.wixproj -c Release -o installer-out
      - name: Install, check and uninstall the MSI
        shell: pwsh
        run: |
          $msi = (Resolve-Path installer-out/GreyHaven.msi).Path
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v msi-install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content msi-install.log -Tail 60; throw "MSI install failed: $($p.ExitCode)" }
          foreach ($f in "GreyHaven.exe", "GreyHaven.Helper.exe", "data\distros.yaml") {
            if (-not (Test-Path "$env:ProgramFiles\GreyHaven\$f")) { throw "Missing after install: $f" }
          }
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\GreyHaven.lnk")) { throw "No Start menu entry" }
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn /l*v msi-uninstall.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI uninstall failed: $($p.ExitCode)" }
          if (Test-Path "$env:ProgramFiles\GreyHaven\GreyHaven.exe") { throw "Files left after uninstall" }
          "MSI: install, check and uninstall OK"
      - name: Install and uninstall with Setup.exe
        shell: pwsh
        run: |
          $setup = (Resolve-Path installer-out/GreyHaven-Setup.exe).Path
          $p = Start-Process $setup -ArgumentList "/quiet /log setup-install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content setup-install.log -Tail 60; throw "Setup install failed: $($p.ExitCode)" }
          if (-not (Test-Path "$env:ProgramFiles\GreyHaven\GreyHaven.exe")) { throw "Setup didn't install the app" }
          $p = Start-Process $setup -ArgumentList "/uninstall /quiet /log setup-uninstall.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup uninstall failed: $($p.ExitCode)" }
          if (Test-Path "$env:ProgramFiles\GreyHaven\GreyHaven.exe") { throw "Files left after Setup uninstall" }
          "Setup.exe: install and uninstall OK"
      - uses: actions/upload-artifact@v4
        with:
          name: greyhaven-installer
          retention-days: 2
          path: |
            installer-out/GreyHaven.msi
            installer-out/GreyHaven-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-logs
          retention-days: 7
          path: "*.log"

  # Every fully green push to main replaces the "latest-test" pre-release, so testers always have
  # one download link that never expires:
  #   https://github.com/<owner>/<repo>/releases/download/latest-test/greyhaven-windows.zip
  # Release files don't count against Actions storage. The release is updated in place (file
  # replaced, tag moved) rather than deleted, so the link keeps working between builds.
  release-test-build:
    needs: [test, windows-build, windows-live-scan, ui-smoke, installer]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: greyhaven-windows
          path: greyhaven-windows
      - uses: actions/download-artifact@v4
        with:
          name: greyhaven-installer
          path: installer
      - name: Zip the build
        run: cd greyhaven-windows && zip -qr ../greyhaven-windows.zip .
      - name: Update the latest-test pre-release
        run: |
          short=${GITHUB_SHA::7}
          when=$(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M %Z')
          notes="Test build of commit $short, built $when. Not for general use: unsigned, and only for testing.

          GreyHaven-Setup.exe installs it like any app. greyhaven-windows.zip runs without installing.
          This pre-release is replaced automatically by every passing build on main."
          if gh release view latest-test >/dev/null 2>&1; then
            # Move the tag to this commit, then replace the file and notes.
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest-test" -f sha="$GITHUB_SHA" -F force=true
            gh release upload latest-test greyhaven-windows.zip installer/GreyHaven-Setup.exe installer/GreyHaven.msi --clobber
            gh release edit latest-test --title "Latest test build ($short)" --notes "$notes" --prerelease
          else
            gh release create latest-test greyhaven-windows.zip installer/GreyHaven-Setup.exe installer/GreyHaven.msi --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Latest test build ($short)" --notes "$notes"
          fi
