name: Download page

# The website moved to Cloudflare Pages (https://greyhaven.pages.dev, .github/workflows/site.yml).
# The old GitHub Pages address (https://vernsmagerns.github.io/greyhaven/) now only forwards
# there, for anyone with an old link: site-forward/.

on:
  push:
    branches: [main]
    paths: ["site-forward/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-forward
      - id: deployment
        uses: actions/deploy-pages@v4
